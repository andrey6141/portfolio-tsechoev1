<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Администрирование — IRON FORCE</title><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="admin.css"><script src="../js/demo-api.js"></script></head><body class="admin-body"><main class="admin-shell"><a class="brand" href="../index.html"><span class="brand-symbol" aria-label="Интерактивная 3D-эмблема IRON FORCE" title="Зажмите и двигайте мышь, чтобы вращать эмблему"></span><span>IRON<span class="yellow"> FORCE</span><small>ADMIN CONSOLE</small></span></a><section id="loginPanel" class="admin-login"><div class="section-kicker">SECURE ACCESS</div><h1>ВХОД <span>АДМИНИСТРАТОРА.</span></h1><form id="loginForm"><label>Логин<input name="username" required autocomplete="username"></label><label>Пароль<input name="password" type="password" required autocomplete="current-password"></label><button class="btn btn-yellow">ВОЙТИ ↗</button><p class="form-status" aria-live="polite"></p></form><small>Демо-режим портфолио: логин <b>demo</b>, пароль <b>demo</b>. Данные сохраняются только в вашем браузере.</small></section><section id="dashboard" hidden><div class="admin-top"><div><div class="section-kicker">CONTROL ROOM</div><h1>ПАНЕЛЬ <span>УПРАВЛЕНИЯ.</span></h1></div><button class="btn btn-outline" id="logoutBtn">ВЫЙТИ</button></div><div class="admin-tabs"><button class="active" data-tab="inventory">Техника</button><button data-tab="inquiries">Заявки</button></div><div id="inventoryTab"><form id="equipmentForm" class="admin-form"><h2 id="equipmentFormTitle">ДОБАВИТЬ ТЕХНИКУ</h2><input type="hidden" name="id"><div class="form-row"><label>Название<input name="name" required></label><label>Категория<input name="category" required placeholder="Экскаваторы"></label></div><div class="form-row"><label>Производитель<input name="brand" required></label><label>Год<input name="year" type="number" value="2025"></label></div><div class="form-row"><label>Мощность<input name="power"></label><label>Рабочая масса<input name="weight"></label></div><div class="form-row"><label>Цена покупки<input name="price" type="number" required></label><label>Аренда / сутки<input name="rent_price" type="number"></label></div><div class="form-row"><label>Статус<input name="status" value="В наличии"></label><label>Фото (JPG/PNG/WebP, до 5 МБ)<input name="photo" type="file" accept="image/jpeg,image/png,image/webp"></label></div><label>URL изображения<input name="image" placeholder="https://... или /uploads/..."></label><label>Описание<textarea name="description" rows="3"></textarea></label><button class="btn btn-yellow">СОХРАНИТЬ</button><button type="button" class="btn btn-outline" id="cancelEdit">ОЧИСТИТЬ</button><p class="form-status" aria-live="polite"></p></form><div id="adminEquipmentList" class="admin-list"></div></div><div id="inquiriesTab" hidden><div id="inquiriesList" class="admin-list"></div></div></section></main><script src="admin.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r160/three.min.js"></script><script src="../js/logo-3d.js"></script></body></html>
